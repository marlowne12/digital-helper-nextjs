<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" fill="none" role="img" aria-label="Digital Helper">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Mark: diamond with lightning bolt -->
  <rect x="2" y="2" width="36" height="36" rx="8" fill="url(#grad)" opacity="0.15"/>
  <rect x="2" y="2" width="36" height="36" rx="8" stroke="url(#grad)" stroke-width="1.5"/>

  <!-- Lightning bolt / D-H fused mark -->
  <path d="M13 10 L13 22 Q13 26 17 26 L22 26 L18 20 L24 20 L16 30 L24 30 L27 22 Q27 18 23 18 L20 18 L24 14 Z"
        fill="url(#grad)" stroke="none"/>

  <!-- Wordmark -->
  <text x="48" y="26" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="-0.3" fill="white">DIGITAL</text>
  <text x="48" y="26" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" letter-spacing="-0.3" fill="rgba(255,255,255,0.5)" dx="61">HELPER</text>
</svg>
